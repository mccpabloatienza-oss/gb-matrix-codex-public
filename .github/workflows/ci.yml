name: synthetic-demo-ci
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run generate
      - run: npm test
      - run: npm run check
      - run: node scripts/audit_public_repo.js
